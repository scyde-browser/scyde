name: core

on:
  push:
    branches: [main]
    paths: ["core/**", "rust-toolchain.toml", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "rust-toolchain.toml", ".github/workflows/core.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Shield latency budgets (PLAN §8.1, ADR-0010)
        run: cargo bench -p shield --bench match
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-shield
          path: core/target/perf/
          if-no-files-found: warn
      # WASM build lands with Phase 1.3
