name: core

on:
  push:
    branches: [main]
    paths: ["core/**", "rust-toolchain.toml", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "rust-toolchain.toml", ".github/workflows/core.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Shield latency budgets (PLAN §8.1, ADR-0010)
        run: cargo bench -p shield --bench match
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-shield
          path: core/target/perf/
          if-no-files-found: warn
      - name: Compile the fixture bundle (smoke)
        run: cargo run --release -p shield-compiler -- --lists ../qa/lists --out target/bundle-fixture --version ci

  wasm:
    # Shield engine for the GeckoView extension (Phase 1.3, ADR-0004): build, fixture, p99 and size budgets.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: wasm
      - name: Install wasm-bindgen-cli (version pinned in shield-wasm/Cargo.toml)
        run: |
          v=$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' shield-wasm/Cargo.toml)
          [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" = "$v" ] || cargo install wasm-bindgen-cli --version "$v" --locked
      - run: shield-wasm/build.sh
      - name: Fixture, p99 < 200 µs, size ≤ 1000 KB gz
        run: node shield-wasm/bench.mjs target/shield-wasm/node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shield-wasm
          path: |
            core/target/shield-wasm/web/
            core/target/perf/shield-wasm.json
