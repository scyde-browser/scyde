name: core

on:
  push:
    branches: [main]
    paths: ["core/**", "design/tokens/**", "tools/contrast-check/**", "rust-toolchain.toml", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "design/tokens/**", "tools/contrast-check/**", "rust-toolchain.toml", ".github/workflows/core.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Contrast gate JSON for the Rust mirror (core/theme, DESIGN.md §2)
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm tokens
          mkdir -p core/target
          node tools/contrast-check/index.mjs --json > core/target/contrast.json
      - run: cargo test --workspace
        env:
          THEME_CONTRAST_JSON: ${{ github.workspace }}/core/target/contrast.json
      - name: Shield latency budgets (PLAN §8.1, ADR-0010)
        run: cargo bench -p shield --bench match
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-shield
          path: core/target/perf/
          if-no-files-found: warn
      - name: Compile the fixture bundle (smoke)
        run: cargo run --release -p shield-compiler -- --lists ../qa/lists --out target/bundle-fixture --version ci

  wasm:
    # Shield engine for the GeckoView extension (Phase 1.3, ADR-0004): build, fixture, p99 and size budgets.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: wasm
      - name: Install wasm-bindgen-cli (version pinned in shield-wasm/Cargo.toml)
        run: |
          v=$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' shield-wasm/Cargo.toml)
          [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" = "$v" ] || cargo install wasm-bindgen-cli --version "$v" --locked
      - run: shield-wasm/build.sh
      - name: Fixture, p99 < 200 µs, size ≤ 1000 KB gz
        run: node shield-wasm/bench.mjs target/shield-wasm/node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shield-wasm
          path: |
            core/target/shield-wasm/web/
            core/target/perf/shield-wasm.json

  perf:
    # Regression gate (PLAN §8.2, Phase 1.10): the PR's Shield bench against the base commit's,
    # alternated 3× on the same runner; a budgeted metric > 10 % worse (median) fails.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: perf
      - name: Base worktree
        run: git worktree add ../base "${{ github.event.pull_request.base.sha }}"
      - name: Build both benches
        run: |
          (cd core && cargo bench -p shield --bench match --no-run)
          if [ -f ../base/core/shield/benches/match.rs ]; then
            (cd ../base/core && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/core/target" cargo bench -p shield --bench match --no-run) \
              && echo "HAS_BASE=yes" >> "$GITHUB_ENV"
          fi
      - name: Run base and head alternately
        run: |
          mkdir -p perf
          for i in 1 2 3; do
            if [ "${HAS_BASE:-}" = yes ]; then
              (cd ../base/core && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/core/target" SHIELD_PERF_OUT="$GITHUB_WORKSPACE/perf/base-$i.json" \
                cargo bench -q -p shield --bench match) || true
            fi
            (cd core && SHIELD_PERF_OUT="$GITHUB_WORKSPACE/perf/head-$i.json" cargo bench -q -p shield --bench match)
          done
      - name: Compare (threshold 10 %)
        run: |
          base=$(ls perf/base-*.json 2>/dev/null | paste -sd, -)
          head=$(ls perf/head-*.json | paste -sd, -)
          node tools/perf/compare.mjs --base "$base" --head "$head" --threshold 0.10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-ab
          path: perf/
