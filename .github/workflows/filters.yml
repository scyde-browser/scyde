name: filters

# Daily Shield filter bundle (PLAN §5.3, ADR-0011):
# download lists → golden tests → shield-compiler → sign → verify → publish
# as release `filters-YYYYMMDD` and move `filters-latest`.
#
# Publishing needs BOTH the `FILTERS_SIGNING_KEY` secret and the committed public key
# `brand/keys/filters.pub` [OWNER] (docs/filters-signing.md). Without them the bundle is built,
# tested and uploaded as an artifact, but not published.
on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (main only)"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/filters.yml"
      - "tools/filters/**"
      - "core/shield-compiler/**"
      - "core/shield/**"

concurrency:
  group: filters-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: filters
      - name: Download lists
        run: node tools/filters/fetch.mjs --out lists
      - name: Golden tests
        working-directory: core
        run: cargo test -p shield-compiler -p shield
      - name: Compile bundle
        working-directory: core
        env:
          FILTERS_SIGNING_KEY: ${{ secrets.FILTERS_SIGNING_KEY }}
        run: |
          V=$(date -u +%Y%m%d)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          cargo build --release -p shield-compiler
          target/release/shield-compiler --lists ../lists --out ../bundle --version "$V"
          echo "SIGNED=$([ -f ../bundle/manifest.json.sig ] && echo yes || echo no)" >> "$GITHUB_ENV"
      - name: Check platform limits
        run: |
          node -e '
            const m = require("./bundle/manifest.json");
            const r = require("./bundle/report.json");
            const bad = [];
            for (const s of m.dnr) if (s.rules > 30000) bad.push(`${s.path}: ${s.rules} > 30000`);
            if (m.dnr.length > 50) bad.push(`${m.dnr.length} DNR rulesets > 50`);
            for (const l of m.ios) if (l.rules > 150000) bad.push(`${l.path}: ${l.rules} > 150000`);
            console.log(`DNR ${r.dnr.converted} rules in ${m.dnr.length} rulesets (over limit ${r.dnr.over_limit})`);
            console.log(`iOS ${r.ios.rules} rules in ${m.ios.length} lists`);
            console.log(`cosmetic ${r.cosmetic.generic} generic, ${r.cosmetic.hosts} hosts`);
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
          '
      - name: Verify signature against brand/keys/filters.pub
        if: env.SIGNED == 'yes'
        working-directory: core
        run: |
          if [ -f ../brand/keys/filters.pub ]; then
            target/release/shield-compiler verify ../bundle --pubkey ../brand/keys/filters.pub
            echo "VERIFIED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::brand/keys/filters.pub is missing: the bundle is signed but cannot be verified, so it is not published"
          fi
      - name: Package
        run: |
          mkdir -p release
          tar -C bundle -czf "release/scyde-filters-${VERSION}.tar.gz" .
          # Flat assets for partial downloads: dnr/rules-00.json -> dnr__rules-00.json
          (cd bundle && find . -type f | sed 's|^\./||' | while read -r f; do cp "$f" "../release/${f//\//__}"; done)
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: filters-${{ env.VERSION }}
          path: release/
      - name: Publish filters-${{ env.VERSION }} and move filters-latest
        if: >-
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          (github.event_name == 'schedule' || inputs.publish) && env.VERIFIED == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="filters-${VERSION}"
          NOTES="Shield filter bundle ${VERSION}. Signed (ed25519, brand/keys/filters.pub). Lists: tools/filters/lists.txt. Licences: EasyList/EasyPrivacy GPLv3 or CC BY-SA, uBlock filters GPLv3, Peter Lowe's list (PLAN §16)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Filters ${VERSION}" --notes "$NOTES" --latest=false
          fi
          # Update filters-latest in place (no window where clients get a 404), then drop stale assets.
          if gh release view filters-latest >/dev/null 2>&1; then
            gh release upload filters-latest release/* --clobber
            gh release edit filters-latest --title "Filters (latest: ${VERSION})" --notes "$NOTES"
            gh release view filters-latest --json assets --jq '.assets[].name' | while read -r a; do
              [ -f "release/$a" ] || gh release delete-asset filters-latest "$a" --yes
            done
          else
            gh release create filters-latest release/* --target "$GITHUB_SHA" --title "Filters (latest: ${VERSION})" --notes "$NOTES" --latest=false
          fi
      - name: Prune dated bundles older than 14 days
        if: >-
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.VERIFIED == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y%m%d)
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E '^filters-[0-9]{8}$' | while read -r t; do
            [ "${t#filters-}" -lt "$cutoff" ] && gh release delete "$t" --cleanup-tag --yes
          done || true
      - name: Summary
        if: always()
        run: |
          {
            echo "### Filters ${VERSION:-?}"
            echo "signed: ${SIGNED:-no} · verified: ${VERIFIED:-no}"
            [ -f bundle/report.json ] && { echo '```json'; cat bundle/report.json; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
