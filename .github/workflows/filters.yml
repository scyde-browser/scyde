name: filters

# Phase 0 skeleton. Phase 1 adds: daily cron, list download, shield-compiler,
# golden tests, minisign/ed25519 signing and publishing as release filters-YYYYMMDD + filters-latest.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build shield-compiler
        run: cargo build -p shield-compiler --release
