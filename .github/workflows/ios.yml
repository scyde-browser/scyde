name: ios

# macOS minutes are expensive: only tags, manual runs and PRs touching ios/** (PLAN §13.1).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["ios/**", "core/ffi/**", "tools/i18n-native/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Core compiles for iOS device + simulator
        working-directory: core
        run: |
          cargo build --workspace --lib --target aarch64-apple-ios
          cargo build --workspace --lib --target aarch64-apple-ios-sim
      - name: ScydeCore.xcframework + Swift bindings (Phase 1.9)
        working-directory: core
        run: ffi/build-apple.sh target/ffi-apple
      - name: Swift bindings run on the iOS simulator
        working-directory: core/target/ffi-apple/ScydeCore
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          set -o pipefail
          xcodebuild test -scheme ScydeCore -destination "id=$UDID" 2>&1 | grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)"
      # Phase 4: xcodegen, simulator build + XCUITest screenshots,
      # unsigned .ipa (Payload/SCYDE.app zipped) on tags for Feather.

  shield-rulelists:
    # shield-compiler iOS output must compile in WebKit and block the fixture (Phase 1.2, ADR-0006).
    # Real lists are compiled too, so a WebKit regression shows up here before filters.yml ships it.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Download filter lists (fall back to the fixture if offline)
        run: |
          mkdir -p lists
          for u in https://easylist.to/easylist/easylist.txt https://easylist.to/easylist/easyprivacy.txt \
                   https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/filters.txt; do
            curl -sSfL --retry 3 -o "lists/$(basename "$u")" "$u" || echo "::warning::could not download $u"
          done
          ls lists/*.txt >/dev/null 2>&1 || cp qa/lists/fixture.txt lists/
      - name: Compile bundles
        working-directory: core
        run: |
          R=../ios/ShieldRuleLists/Tests/ShieldRuleListsTests/Resources/rulelists
          cargo run --release -p shield-compiler -- --lists ../lists --out ../out/real --version ci
          cargo run --release -p shield-compiler -- --lists ../qa/lists --out ../out/fixture --version ci
          mkdir -p "$R/bundle" "$R/fixture"
          cp ../out/real/ios/*.json "$R/bundle/"
          cp ../out/fixture/ios/scyde-00.json "$R/fixture/"
          cp -R ../qa/adblock "$R/qa-adblock"
          cat ../out/real/report.json
      - name: Test on iOS simulator
        working-directory: ios/ShieldRuleLists
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator: $UDID"
          set -o pipefail
          xcodebuild test -scheme ShieldRuleLists -destination "id=$UDID" 2>&1 | tee ../../rulelists.log | grep -E "SCYDE_RESULT|Test Case|error:|TEST (SUCCEEDED|FAILED)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 3
          name: shield-rulelists
          path: |
            rulelists.log
            out/real/report.json
            out/real/manifest.json

  app:
    # SCYDE for iOS (Phase 4): simulator screenshots + unsigned .ipa for Feather (PLAN §9.3).
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Web pages, tokens, strings, icons
        run: |
          pnpm install --frozen-lockfile
          pnpm tokens
          for a in newtab settings shields library; do pnpm --filter "@scyde/app-$a" build; done
          R=ios/SCYDE
          mkdir -p $R/Resources/pages $R/Sources/Generated
          for a in newtab settings shields library; do cp -R web/apps/$a/dist $R/Resources/pages/$a; done
          cp web/packages/tokens/dist/swift/ScydeTokens.swift $R/Sources/Generated/
          node tools/i18n-native/build.mjs --ios $R/Sources/Generated/Localizable.xcstrings
          node tools/icon-export/export.mjs --out dist/icons
          cp -R dist/icons/owner-s/ios/AppIcon.appiconset/. $R/Resources/Assets.xcassets/AppIcon.appiconset/
      - name: Filter bundle (iOS rule lists, ADR-0006)
        run: |
          node tools/filters/fetch.mjs --out lists || { echo "::warning::list download failed, using the fixture"; rm -rf lists; mkdir lists; }
          cp qa/lists/fixture.txt lists/zz-fixture.txt
          (cd core && cargo run --release -p shield-compiler -- --lists ../lists --out ../bundle --version "$(date -u +%Y%m%d)")
          mkdir -p ios/SCYDE/Resources/filters
          cp -R bundle/ios bundle/manifest.json ios/SCYDE/Resources/filters/
          cp shield-extension/src/scroll-guard.js ios/SCYDE/Resources/filters/
      - name: ScydeCore.xcframework (core/ffi)
        working-directory: core
        run: ffi/build-apple.sh target/ffi-apple
      - name: Xcode project
        working-directory: ios/SCYDE
        run: |
          brew install xcodegen
          xcodegen
      - name: Simulator build and screenshots
        working-directory: ios/SCYDE
        run: |
          set -o pipefail
          xcodebuild build -project SCYDE.xcodeproj -scheme SCYDE -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO | tail -30
          APP=$(find build/sim -name SCYDE.app -type d | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p ../../shots
          (cd ../.. && node qa/serve.mjs 8787 > /dev/null 2>&1 &)
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            xcrun simctl launch --terminate-running-process "$UDID" dev.scyde.browser
            sleep 12
            xcrun simctl io "$UDID" screenshot ../../shots/newtab-$mode.png
          done
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch --terminate-running-process "$UDID" dev.scyde.browser -open http://127.0.0.1:8787/adblock/index.html
          sleep 25
          xcrun simctl io "$UDID" screenshot ../../shots/qa-adblock.png
          xcrun simctl launch --terminate-running-process "$UDID" dev.scyde.browser -open http://127.0.0.1:8787/scroll/index.html
          sleep 12
          xcrun simctl io "$UDID" screenshot ../../shots/qa-scroll.png
          xcrun simctl launch --terminate-running-process "$UDID" dev.scyde.browser -page settings
          sleep 8
          xcrun simctl io "$UDID" screenshot ../../shots/settings-sheet.png
      - name: Unsigned .ipa (Feather signs it)
        working-directory: ios/SCYDE
        run: |
          set -o pipefail
          xcodebuild archive -project SCYDE.xcodeproj -scheme SCYDE -sdk iphoneos -configuration Release \
            -archivePath build/SCYDE.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -20
          mkdir -p build/Payload
          cp -R build/SCYDE.xcarchive/Products/Applications/SCYDE.app build/Payload/
          (cd build && zip -qry SCYDE-unsigned.ipa Payload)
          ls -la build/SCYDE-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 3
          name: scyde-ios
          path: |
            ios/SCYDE/build/SCYDE-unsigned.ipa
            shots/
