name: spikes

# Phase 0.5 engine spikes (S1–S5). Deleted together with spikes/ once ADRs 0002–0007 are written.
on:
  pull_request:
    paths: ["spikes/**", "qa/**", ".github/workflows/spikes.yml"]
  workflow_dispatch:
    inputs:
      job:
        description: "Which spike to run (all, s1-ios, s3-wasm, s3-geckoview-app, s4-ios-rulelists, s5-windows)"
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LISTS: |
    https://easylist.to/easylist/easylist.txt
    https://easylist.to/easylist/easyprivacy.txt
    https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/filters.txt

jobs:
  s1-ios:
    # Unsigned .ipa for the manual Google sign-in test (G1) through Feather / SideStore.
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 's1-ios'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spikes/s1-ios
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen
      - name: Archive (unsigned) and package .ipa
        run: |
          set -o pipefail
          xcodebuild archive -project ScydeS1.xcodeproj -scheme ScydeS1 -sdk iphoneos -configuration Release \
            -archivePath build/ScydeS1.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -20
          mkdir -p build/Payload
          cp -R build/ScydeS1.xcarchive/Products/Applications/ScydeS1.app build/Payload/
          (cd build && zip -qry ScydeS1.ipa Payload)
          ls -la build/ScydeS1.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: s1-ios-ipa
          path: spikes/s1-ios/build/ScydeS1.ipa

  s3-wasm:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 's3-wasm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/s3-geckoview/wasm-engine
      - name: Download filter lists
        run: |
          mkdir -p lists
          for u in $LISTS; do curl -sSfL --retry 3 -o "lists/$(basename "$u")" "$u"; done
          wc -l lists/*
      - name: Build WASM engine
        working-directory: spikes/s3-geckoview/wasm-engine
        run: |
          cargo build --release --target wasm32-unknown-unknown
          v=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$v" --locked
          wasm-bindgen --target nodejs --out-dir pkg target/wasm32-unknown-unknown/release/scyde_shield_wasm_spike.wasm
          echo '{"type":"commonjs"}' > pkg/package.json
          echo "wasm gz bytes: $(gzip -9c pkg/*.wasm | wc -c)"
      - name: Benchmark (G3 WASM part)
        working-directory: spikes/s3-geckoview/wasm-engine
        run: node bench.mjs ../../../lists/*.txt --json ../../../s3-wasm.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-wasm
          path: s3-wasm.json

  s3-geckoview-app:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 's3-geckoview-app'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spikes/s3-geckoview/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/s3-geckoview/wasm-engine
      - name: Build WASM engine into the extension (no-modules target)
        working-directory: spikes/s3-geckoview/wasm-engine
        run: |
          cargo build --release --target wasm32-unknown-unknown
          v=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$v" --locked
          wasm-bindgen --target no-modules --out-dir ../app/app/src/main/assets/extension/engine target/wasm32-unknown-unknown/release/scyde_shield_wasm_spike.wasm
      - name: Bundle filter lists
        run: |
          L=app/src/main/assets/extension/lists
          mkdir -p $L
          cp ../../../qa/lists/fixture.txt $L/
          for u in $LISTS; do curl -sSfL --retry 3 -o "$L/$(basename "$u")" "$u"; done
          ls -la $L
      - name: Build APKs
        run: |
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
          ./gradlew --no-daemon -q app:dependencies --configuration debugRuntimeClasspath | grep -m1 geckoview || true
          ls -la app/build/outputs/apk/debug
      - uses: actions/upload-artifact@v4
        with:
          name: s3-geckoview-apk
          path: spikes/s3-geckoview/app/app/build/outputs/apk/debug/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Serve qa fixtures
        working-directory: .
        run: node qa/serve.mjs 8787 &
      - name: G3 instrumented test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: spikes/s3-geckoview/app
          script: ./gradlew --no-daemon connectedDebugAndroidTest || (adb logcat -d | grep -E "SCYDE|GeckoView|Gecko" | tail -200; exit 1); adb logcat -d | grep "SCYDE_RESULT" > ../../../s3-app.txt || true
      - name: Collect results
        if: always()
        working-directory: .
        run: |
          ls spikes/s3-geckoview/app/app/build/outputs/androidTest-results/connected/ 2>/dev/null || true
          cat s3-app.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-geckoview-results
          path: |
            s3-app.txt
            spikes/s3-geckoview/app/app/build/outputs/androidTest-results
            spikes/s3-geckoview/app/app/build/reports/androidTests

  s4-ios-rulelists:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 's4-ios-rulelists'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/s4-ios-rulelists/converter
      - name: Download filter lists
        run: |
          mkdir -p lists
          for u in $LISTS; do curl -sSfL --retry 3 -o "lists/$(basename "$u")" "$u"; done
      - name: Convert lists to WKContentRuleList JSON (>= 150k rules, split)
        working-directory: spikes/s4-ios-rulelists/converter
        run: |
          R=../RuleListSpike/Tests/RuleListSpikeTests/Resources/rulelists
          cargo run --release -- --out "$R" --repeat 2 ../../../lists/*.txt
          cargo run --release -- --out fixture-out ../../../qa/lists/fixture.txt
          cp fixture-out/scyde-00.json "$R/fixture.json"
          ls -la "$R"
      - name: Serve qa fixtures
        run: node qa/serve.mjs 8787 &
      - name: Test on iOS simulator
        working-directory: spikes/s4-ios-rulelists/RuleListSpike
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator: $UDID"
          set -o pipefail
          xcodebuild test -scheme RuleListSpike -destination "id=$UDID" 2>&1 | tee ../../../s4.log | grep -E "SCYDE_RESULT|Test Case|error:|TEST (SUCCEEDED|FAILED)"
      - name: Collect results
        if: always()
        run: grep -h "SCYDE_RESULT" s4.log | sed 's/^.*SCYDE_RESULT //' > s4-results.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s4-results
          path: |
            s4-results.txt
            s4.log

  s5-windows:
    # S5 (G5) multiwebview + popover timings, S2 (G2) option B vs no blocking, S1 (G1) exe for the manual sign-in test.
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 's5-windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/s5-tauri/src-tauri
      - name: Build
        working-directory: spikes/s5-tauri/src-tauri
        run: cargo build --release
      - name: Download filter lists
        shell: bash
        run: |
          mkdir -p lists
          for u in $LISTS; do curl -sSfL --retry 3 -o "lists/$(basename "$u")" "$u"; done
      - name: Serve qa fixtures
        shell: bash
        run: node qa/serve.mjs 8787 > /dev/null 2>&1 &
      - name: S5 bench (20 tabs, switches, popover)
        run: ./spikes/s5-tauri/ci/run.ps1 -Exe spikes/s5-tauri/src-tauri/target/release/scyde-spike-s5.exe -Name s5 -AppArgs '--mode','bench','--out','s5.json','--hold','10' -ShotAfter 12
      - name: S2 baseline (no blocking)
        run: ./spikes/s5-tauri/ci/run.ps1 -Exe spikes/s5-tauri/src-tauri/target/release/scyde-spike-s5.exe -Name s2-none -AppArgs '--mode','shield','--shield','none','--out','s2-none.json','--rounds','3','--sites',$env:SITES -ShotAfter 20
        env:
          SITES: https://www.index.hr/,https://www.24sata.hr/,https://www.jutarnji.hr/,https://www.youtube.com/,https://edition.cnn.com/
      - name: S2 option B (WebResourceRequested + adblock-rust)
        run: ./spikes/s5-tauri/ci/run.ps1 -Exe spikes/s5-tauri/src-tauri/target/release/scyde-spike-s5.exe -Name s2-b -AppArgs '--mode','shield','--shield','b','--out','s2-b.json','--rounds','3','--sites',$env:SITES,'--lists',$env:LISTFILES -ShotAfter 20
        env:
          SITES: https://www.index.hr/,https://www.24sata.hr/,https://www.jutarnji.hr/,https://www.youtube.com/,https://edition.cnn.com/
          LISTFILES: qa/lists/fixture.txt,lists/easylist.txt,lists/easyprivacy.txt,lists/filters.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s5-s2-results
          path: |
            s5.json
            s5.png
            s2-none.json
            s2-none.png
            s2-b.json
            s2-b.png
      - uses: actions/upload-artifact@v4
        with:
          name: s1-windows-exe
          path: spikes/s5-tauri/src-tauri/target/release/scyde-spike-s5.exe
