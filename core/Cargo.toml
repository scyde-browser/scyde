[workspace]
resolver = "3"
members = [
    "shield",
    "shield-compiler",
    "shield-wasm",
    "omnibox",
    "places",
    "settings",
    "theme",
    "ffi",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
repository = "https://github.com/scyde-browser/scyde"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Tests with 100k history rows (places) need an optimized SQLite even in debug builds.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.bench]
debug = true
