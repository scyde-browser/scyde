[package]
name = "shield-wasm"
description = "Shield engine for the GeckoView built-in extension (wasm32 + wasm-bindgen, ADR-0004)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shield = { path = "../shield" }
# The wasm-bindgen CLI must match this exact version (CI installs it from Cargo.lock).
wasm-bindgen = "=0.2.130"
serde_json = "1"

[lints]
workspace = true
