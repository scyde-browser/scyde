[package]
name = "shield"
description = "Shield: ad, tracker and popup decisions (our wrapper around adblock-rust)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Approved library (owner, 2026-11-11; CLAUDE.md rule 11). `single-thread` is off so the
# engine is Send + Sync for the FFI layer and host processes.
adblock = { version = "=0.13.5", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }
serde_json = "1"

[[bench]]
name = "match"
harness = false

[lints]
workspace = true
