<!doctype html>
<html lang="hr" data-accent="sky" data-density="comfortable" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file:; connect-src 'none'">
  <title>SCYDE · desktop chrome (prototip)</title>
  <link rel="stylesheet" href="../../../web/packages/tokens/dist/css/tokens.css">
  <link rel="stylesheet" href="../_shared/base.css">
  <script src="../_shared/strings.js"></script>
  <script src="../_shared/proto.js"></script>
  <style>
    body { height: 100dvh; overflow: hidden; font-size: var(--type-label-size); line-height: var(--type-label-line-height); }
    .window { display: grid; grid-template-rows: var(--size-chrome-tabstrip) var(--size-chrome-toolbar) 1fr; grid-template-columns: var(--size-chrome-rail) 1fr; height: 100%; background: var(--surface-chrome); }

    /* ---------- tab strip (Windows: Mica underneath) ---------- */
    .tabstrip { grid-column: 1 / -1; display: flex; align-items: flex-end; padding-left: var(--space-12); }
    .tabs { display: flex; align-items: flex-end; gap: var(--space-2); min-width: 0; flex: 1; }
    .tab {
      position: relative; display: flex; align-items: center; gap: var(--space-8);
      flex: 1 1 var(--size-chrome-tab-max); min-width: var(--size-chrome-tab-min); max-width: var(--size-chrome-tab-max);
      height: var(--size-chrome-tab-height);
      padding: 0 var(--space-6) 0 var(--space-12);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      color: var(--text-secondary);
      transition: background-color var(--motion-duration-instant) var(--motion-ease-out);
    }
    .tab:hover { background: var(--surface-sunken); }
    .tab[aria-selected="true"] { background: var(--surface-canvas); color: var(--text-primary); }
    .fav { flex: none; display: grid; place-items: center; width: var(--size-chrome-favicon); height: var(--size-chrome-favicon); border-radius: var(--radius-xs); background: var(--fav, var(--accent-fill)); color: var(--accent-on-fill); font-size: var(--type-micro-size); font-weight: var(--font-weight-medium); }
    .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, black 80%, transparent); }
    .tab .close { flex: none; display: grid; place-items: center; width: var(--space-24); height: var(--space-24); border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--text-secondary); opacity: 0; }
    .tab:hover .close, .tab[aria-selected="true"] .close { opacity: 1; }
    .tab .close:hover { background: var(--surface-sunken); }
    .tab .close .icon { width: var(--space-16); height: var(--space-16); }
    /* Sleep (DESIGN §6.3) */
    .tab.sleeping .fav { opacity: var(--motion-sleep-opacity); }
    .tab.sleeping .zz { position: absolute; left: calc(var(--space-12) + var(--space-8)); top: var(--space-4); width: var(--space-12); height: var(--space-12); color: var(--accent-ink); }
    .newtab { flex: none; display: grid; place-items: center; width: var(--size-hit-desktop); height: var(--size-hit-desktop); margin: 0 0 var(--space2, var(--space-2)) var(--space-4); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-secondary); }
    .newtab:hover { background: var(--surface-sunken); }
    .drag { flex: 0 0 var(--space-64); align-self: stretch; }
    .captions { display: flex; align-self: stretch; }
    .captions button { width: var(--size-chrome-caption-button); border: 0; background: transparent; color: var(--text-primary); display: grid; place-items: center; }
    .captions button .icon { width: var(--space-16); height: var(--space-16); }
    .captions button:hover { background: var(--surface-sunken); }
    .captions button.x:hover { background: var(--status-danger); color: var(--text-on-ember); }

    /* ---------- toolbar ---------- */
    .toolbar { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-8) 0 var(--space-12); background: var(--surface-canvas); }
    .tb { display: grid; place-items: center; width: var(--size-hit-desktop); height: var(--size-hit-desktop); border: 0; border-radius: var(--radius-full); background: transparent; color: var(--text-secondary); transition: background-color var(--motion-duration-instant) var(--motion-ease-out), transform var(--motion-duration-instant) var(--motion-ease-out); }
    .tb:hover { background: var(--surface-sunken); color: var(--text-primary); }
    .tb:active { transform: scale(var(--motion-press-scale)); }
    .tb[disabled] { opacity: 0.4; pointer-events: none; }
    .omni-wrap { position: relative; flex: 1; margin: 0 var(--space-8); }
    .omnibox { display: flex; align-items: center; gap: var(--space-8); height: var(--size-chrome-omnibox); padding: 0 var(--space-12); border-radius: var(--radius-full); background: var(--surface-sunken); color: var(--text-secondary); }
    .omnibox .icon { width: var(--space-16); height: var(--space-16); }
    .omnibox .secure { color: var(--text-secondary); }
    .omnibox .url { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
    .omnibox .url b { color: var(--text-primary); font-weight: var(--font-weight-regular); } /* eTLD+1 emphasised (PLAN §7) */
    .omnibox .star { margin-left: auto; color: var(--text-tertiary); }
    .omni-focused .omnibox { background: var(--surface-raised); box-shadow: 0 0 0 var(--size-focus-ring) var(--accent-ring); color: var(--text-primary); border-radius: var(--radius-md) var(--radius-md) 0 0; }
    .omni-focused .typed { color: var(--text-primary); }
    .omni-focused .typed .rest { background: var(--accent-fill); color: var(--accent-on-fill); }
    .pill { display: inline-flex; align-items: center; gap: var(--space-6); height: var(--space-24); padding: 0 var(--space-8); border-radius: var(--radius-full); background: var(--surface-raised); box-shadow: inset 0 0 0 1px var(--border-hairline); color: var(--text-secondary); font-size: var(--type-caption-size); }
    .shield-btn { position: relative; display: inline-flex; align-items: center; gap: var(--space-4); height: var(--size-hit-desktop); padding: 0 var(--space-8); border: 0; border-radius: var(--radius-full); background: transparent; color: var(--status-shield); }
    .shield-btn:hover, .shield-btn[aria-expanded="true"] { background: var(--surface-sunken); }
    .shield-btn .count { color: var(--text-secondary); font-size: var(--type-caption-size); }

    /* ---------- rail (web panels) ---------- */
    .rail { display: flex; flex-direction: column; align-items: center; gap: var(--space-8); padding: var(--space-12) 0; background: var(--surface-canvas); }
    .rail button { display: grid; place-items: center; width: var(--size-chrome-rail-button); height: var(--size-chrome-rail-button); border: 0; border-radius: var(--radius-full); background: var(--surface-sunken); color: var(--text-secondary); transition: transform var(--motion-duration-instant) var(--motion-ease-out); }
    .rail button:hover { color: var(--text-primary); }
    .rail button:active { transform: scale(var(--motion-press-scale)); }
    .rail button.active { box-shadow: 0 0 0 var(--size-focus-ring) var(--surface-canvas), 0 0 0 calc(var(--size-focus-ring) * 2) var(--accent-ring); color: var(--accent-ink); }
    .rail .add { background: transparent; box-shadow: inset 0 0 0 1px var(--border-hairline); }
    .rail .spacer { flex: 1; }

    /* ---------- page (stand-in for a web page, deliberately neutral) ---------- */
    .content { position: relative; background: var(--surface-canvas); padding: 0 var(--space-8) var(--space-8) 0; }
    .page { height: 100%; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: inset 0 0 0 1px var(--border-hairline); overflow: hidden; padding: var(--space-32) var(--space-48); }
    .ph { background: var(--surface-sunken); border-radius: var(--radius-xs); height: var(--space-12); margin-bottom: var(--space-12); }
    .ph.h { height: var(--space-32); width: 55%; margin-bottom: var(--space-24); }
    .ph.img { height: calc(var(--space-80) * 3); border-radius: var(--radius-media); margin: var(--space-24) 0; }
    .cols { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-40); }

    /* ---------- popovers (real build: separate pre-created windows) ---------- */
    .popover { position: absolute; z-index: 10; background: var(--surface-raised); border-radius: var(--radius-md); box-shadow: var(--elev-2); }
    /* Bloom (DESIGN §6.3) */
    @keyframes bloom { from { opacity: 0; transform: scale(var(--motion-bloom-scale)); } to { opacity: 1; transform: none; } }
    .popover { animation: bloom var(--motion-duration-fast) var(--motion-ease-out) both; }
    [data-motion="reduced"] .popover { animation-name: fade; }

    .suggest { left: 0; right: 0; top: var(--size-chrome-omnibox); border-radius: 0 0 var(--radius-md) var(--radius-md); padding: var(--space-6); transform-origin: top center; box-shadow: var(--elev-2), 0 0 0 var(--size-focus-ring) var(--accent-ring); clip-path: inset(0 calc(var(--size-focus-ring) * -1) calc(var(--size-focus-ring) * -1 - var(--space-32)) calc(var(--size-focus-ring) * -1)); }
    .row { display: grid; grid-template-columns: var(--space-24) 1fr auto; align-items: center; gap: var(--space-12); height: var(--size-popover-omnibox-row); padding: 0 var(--space-12); border-radius: var(--radius-sm); color: var(--text-primary); }
    .row .icon { width: var(--space-16); height: var(--space-16); color: var(--text-tertiary); }
    .row .meta { color: var(--text-tertiary); }
    .row .host { color: var(--accent-ink); }
    .row[aria-selected="true"] { background: var(--surface-sunken); }
    .row .fav { width: var(--space-16); height: var(--space-16); }
    kbd { font-family: var(--font-family-ui); font-size: var(--type-micro-size); padding: 0 var(--space-6); border-radius: var(--radius-xs); background: var(--surface-sunken); color: var(--text-secondary); box-shadow: inset 0 -1px 0 var(--border-hairline); }

    .shield { right: var(--space-8); top: calc(var(--size-chrome-tabstrip) + var(--size-chrome-toolbar) - var(--space-4)); width: var(--size-popover-shield); padding: var(--space-20); transform-origin: top right; display: grid; gap: var(--space-16); }
    .shield header { display: flex; align-items: center; gap: var(--space-12); }
    .shield h2 { flex: 1; margin: 0; font-size: var(--type-title-size); line-height: var(--type-title-line-height); letter-spacing: var(--type-title-tracking); font-weight: var(--font-weight-medium); }
    .shield h2 small { display: block; font-size: var(--type-caption-size); line-height: var(--type-caption-line-height); letter-spacing: 0; color: var(--status-shield); font-weight: var(--font-weight-regular); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); }
    .stat { padding: var(--space-12) var(--space-16); border-radius: var(--radius-md); background: var(--surface-sunken); }
    .stat b { display: block; font-size: var(--type-headline-size); line-height: var(--type-headline-line-height); letter-spacing: var(--type-headline-tracking); font-weight: var(--font-weight-medium); font-variant-numeric: tabular-nums; }
    .stat span { display: block; min-height: calc(var(--type-caption-line-height) * 2); color: var(--text-secondary); font-size: var(--type-caption-size); line-height: var(--type-caption-line-height); }
    .field { display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); }
    .seg { display: inline-grid; grid-auto-flow: column; padding: var(--space-2); border-radius: var(--radius-full); background: var(--surface-sunken); }
    .seg button { height: var(--space-24); padding: 0 var(--space-12); border: 0; border-radius: var(--radius-full); background: transparent; color: var(--text-secondary); font-size: var(--type-caption-size); }
    .seg button[aria-pressed="true"] { background: var(--surface-raised); color: var(--text-primary); box-shadow: var(--elev-1); }
    .toggle { position: relative; flex: none; width: var(--size-toggle-width); height: var(--size-toggle-height); border: 0; border-radius: var(--radius-full); background: var(--border-strong); padding: 0; }
    .toggle::after { content: ""; position: absolute; top: calc((var(--size-toggle-height) - var(--size-toggle-knob)) / 2); left: calc((var(--size-toggle-height) - var(--size-toggle-knob)) / 2); width: var(--size-toggle-knob); height: var(--size-toggle-knob); border-radius: var(--radius-full); background: var(--surface-raised); box-shadow: var(--elev-1); transition: transform var(--motion-spring-snappy-duration) var(--motion-spring-snappy); }
    .toggle[aria-checked="true"] { background: var(--status-shield); }
    .toggle[aria-checked="true"]::after { transform: translateX(calc(var(--size-toggle-width) - var(--size-toggle-height))); }
    .toggle.big { width: calc(var(--size-toggle-width) * 1.2); height: calc(var(--size-toggle-height) * 1.2); }
    .toggle.big::after { top: calc((var(--size-toggle-height) * 1.2 - var(--size-toggle-knob) * 1.2) / 2); left: calc((var(--size-toggle-height) * 1.2 - var(--size-toggle-knob) * 1.2) / 2); width: calc(var(--size-toggle-knob) * 1.2); height: calc(var(--size-toggle-knob) * 1.2); }
    .toggle.big[aria-checked="true"]::after { transform: translateX(calc((var(--size-toggle-width) - var(--size-toggle-height)) * 1.2)); }
    .link { display: inline-flex; align-items: center; gap: var(--space-4); color: var(--accent-ink); text-decoration: none; }
    .link .icon { width: var(--space-16); height: var(--space-16); }
    hr { border: 0; height: 1px; background: var(--border-hairline); margin: 0; }
  </style>
</head>
<body>
  <div class="window" id="win">
    <header class="tabstrip">
      <div class="tabs" role="tablist" id="tabs"></div>
      <button class="newtab" type="button" data-i18n-attr="aria-label:tab.new"><span class="icon" data-icon="plus"></span></button>
      <div class="drag"></div>
      <div class="captions">
        <button type="button" aria-label="Minimize"><span class="icon" data-icon="min"></span></button>
        <button type="button" aria-label="Maximize"><span class="icon" data-icon="max"></span></button>
        <button type="button" class="x" aria-label="Close"><span class="icon" data-icon="x"></span></button>
      </div>
    </header>

    <nav class="toolbar">
      <button class="tb" type="button" data-i18n-attr="aria-label:nav.back"><span class="icon" data-icon="back"></span></button>
      <button class="tb" type="button" disabled data-i18n-attr="aria-label:nav.forward"><span class="icon" data-icon="forward"></span></button>
      <button class="tb" type="button" data-i18n-attr="aria-label:nav.reload"><span class="icon" data-icon="reload"></span></button>
      <div class="omni-wrap" id="omni"></div>
      <span class="pill" id="popup-pill"><span class="icon" data-icon="tabs" style="width:var(--space-12);height:var(--space-12)"></span><span data-i18n="popup.blocked"></span></span>
      <button class="shield-btn" type="button" id="shield-btn" aria-expanded="false" data-i18n-attr="aria-label:shield.label"><span class="icon" data-icon="shield-check"></span><span class="count num">23</span></button>
      <button class="tb" type="button" data-i18n-attr="aria-label:menu.label"><span class="icon" data-icon="more"></span></button>
    </nav>

    <aside class="rail" aria-label="Web paneli">
      <button type="button" class="active" aria-label="Mail"><span class="icon" data-icon="mail"></span></button>
      <button type="button" aria-label="Chat"><span class="icon" data-icon="chat"></span></button>
      <button type="button" aria-label="Messenger"><span class="icon" data-icon="send"></span></button>
      <button type="button" class="add" data-i18n-attr="aria-label:rail.add_panel"><span class="icon" data-icon="plus"></span></button>
      <div class="spacer"></div>
      <button type="button" data-i18n-attr="aria-label:rail.settings"><span class="icon" data-icon="sliders"></span></button>
    </aside>

    <main class="content">
      <div class="page" aria-hidden="true">
        <div class="cols">
          <div><div class="ph h"></div><div class="ph"></div><div class="ph" style="width:92%"></div><div class="ph" style="width:80%"></div><div class="ph img"></div><div class="ph"></div><div class="ph" style="width:70%"></div></div>
          <div><div class="ph" style="width:60%"></div><div class="ph img" style="height:calc(var(--space-80) * 1.5)"></div><div class="ph"></div><div class="ph" style="width:85%"></div><div class="ph img" style="height:calc(var(--space-80) * 1.5)"></div></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const state = new URLSearchParams(location.search).get('state') || 'shield';
      const fill = (n) => `var(--aura-${['sky', 'periwinkle', 'lavender', 'mint', 'ember'][n]}-fill)`;
      const tabs = [
        { t: 'Index.hr – Najnovije vijesti iz Hrvatske i svijeta', m: 'I', c: 0, sel: true },
        { t: 'GitHub – scyde-browser/scyde: SCYDE Browser', m: 'G', c: 3 },
        { t: 'YouTube', m: 'Y', c: 1, sleeping: true },
        { t: 'Kako napraviti savršeni domaći kruh od kiselog tijesta – recept korak po korak s fotografijama i savjetima', m: 'K', c: 2 },
      ];
      const tabsEl = document.getElementById('tabs');
      tabsEl.innerHTML = tabs.map((x) => `
        <div class="tab${x.sleeping ? ' sleeping' : ''}" role="tab" aria-selected="${!!x.sel}" ${x.sleeping ? `title="${t('tab.sleeping', { mb: 212 })}"` : ''}>
          <span class="fav" style="--fav:${fill(x.c)}">${x.m}</span>
          ${x.sleeping ? '<span class="zz icon" data-icon="moon"></span>' : ''}
          <span class="title">${x.t}</span>
          <button class="close" type="button" aria-label="${t('tab.close')}"><span class="icon" data-icon="x"></span></button>
        </div>`).join('');

      const omni = document.getElementById('omni');
      if (state === 'omnibox') {
        omni.classList.add('omni-focused');
        omni.innerHTML = `
          <div class="omnibox"><span class="icon" data-icon="search"></span><span class="url typed">jutarnji<span class="rest">.hr</span></span></div>
          <div class="popover suggest" role="listbox">
            <div class="row" role="option" aria-selected="true"><span class="fav" style="--fav:${fill(4)}">J</span><span>Jutarnji list – Najnovije vijesti · <span class="host">jutarnji.hr</span></span><kbd>Enter</kbd></div>
            <div class="row" role="option"><span class="icon" data-icon="search"></span><span>${t('omnibox.suggest.search', { q: 'jutarnji list' })}</span><span class="meta">DuckDuckGo</span></div>
            <div class="row" role="option"><span class="icon" data-icon="search"></span><span>${t('omnibox.suggest.search', { q: 'jutarnji list sport' })}</span><span></span></div>
            <div class="row" role="option"><span class="icon" data-icon="clock"></span><span>Vijesti – Jutarnji.hr · <span class="host">jutarnji.hr/vijesti</span></span><span class="meta">${t('omnibox.suggest.history')}</span></div>
            <div class="row" role="option"><span class="icon" data-icon="star"></span><span>Sport · <span class="host">sportske.jutarnji.hr</span></span><span class="meta">${t('omnibox.suggest.bookmark')}</span></div>
          </div>`;
        document.getElementById('popup-pill').hidden = true;
      } else {
        omni.innerHTML = `<div class="omnibox"><span class="icon secure" data-icon="lock" title="${t('omnibox.secure')}"></span><span class="url"><b>index.hr</b>/vijesti/clanak/hrvatska-dobila-novi-most/2581044.aspx</span><span class="icon star" data-icon="star"></span></div>`;
      }

      if (state === 'shield') {
        document.getElementById('shield-btn').setAttribute('aria-expanded', 'true');
        const p = document.createElement('section');
        p.className = 'popover shield';
        p.setAttribute('role', 'dialog');
        p.innerHTML = `
          <header>
            <h2>${t('shield.panel.title', { site: 'index.hr' })}<small>${t('shield.on_for_site')}</small></h2>
            <button class="toggle big" role="switch" aria-checked="true" aria-label="${t('shield.on_for_site')}"></button>
          </header>
          <div class="stats">
            <div class="stat"><b>23</b><span>${t('shield.panel.blocked')}</span></div>
            <div class="stat"><b>1,8 MB</b><span>${t('shield.panel.saved')}</span></div>
          </div>
          <hr>
          <div class="field"><span>${t('shield.panel.level')}</span><div class="seg"><button aria-pressed="true">${t('shield.panel.level.standard')}</button><button aria-pressed="false">${t('shield.panel.level.aggressive')}</button></div></div>
          <div class="field"><span>${t('shield.panel.zen')}</span><button class="toggle" role="switch" aria-checked="false" aria-label="${t('shield.panel.zen')}"></button></div>
          <hr>
          <a class="link" href="#">${t('shield.panel.details')}<span class="icon" data-icon="chevron"></span></a>`;
        document.getElementById('win').appendChild(p);
        p.querySelectorAll('[role=switch]').forEach((b) => b.addEventListener('click', () => b.setAttribute('aria-checked', b.getAttribute('aria-checked') !== 'true')));
      }
      applyProto();
    });
  </script>
</body>
</html>
