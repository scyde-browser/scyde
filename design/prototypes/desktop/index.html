<!doctype html>
<html lang="hr" data-accent="ember" data-density="comfortable" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file:; connect-src 'none'">
  <title>SCYDE · Otok · desktop (prototip)</title>
  <link rel="stylesheet" href="../../../web/packages/tokens/dist/css/tokens.css">
  <link rel="stylesheet" href="../_shared/base.css">
  <script src="../_shared/strings.js"></script>
  <script src="../_shared/proto.js"></script>
  <style>
    body { height: 100dvh; overflow: hidden; }
    .win { position: relative; height: 100%; }
    .mono { font-family: var(--font-family-mono); }

    /* ---------- floating Windows captions (no bar) ---------- */
    .caps { position: absolute; top: var(--space-8); right: var(--space-12); z-index: 30; display: flex; gap: var(--space-2); }
    .caps button { width: var(--size-chrome-caption-button); height: var(--size-chrome-caption-height); display: grid; place-items: center; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-tertiary); }
    .caps button .icon { width: var(--space-12); height: var(--space-12); }
    .caps button:hover { background: var(--surface-sunken); color: var(--text-primary); }
    .caps button.x:hover { background: var(--status-danger); color: var(--text-on-ember); }

    /* ---------- New Tab ---------- */
    .nt { height: 100%; display: grid; grid-template-columns: 1fr var(--size-newtab-recent-width); gap: var(--space-80); padding: var(--space-64) var(--space-80) calc(var(--size-island-height) + var(--space-80)); }
    .nt-main { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .shield-line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-8) var(--space-20); font-family: var(--font-family-mono); font-size: var(--type-data-size); line-height: var(--type-data-line-height); color: var(--text-secondary); }
    .shield-line b { color: var(--text-primary); font-weight: var(--font-weight-medium); font-variant-numeric: tabular-nums; }
    .lamp { width: var(--space-8); height: var(--space-8); border-radius: var(--radius-full); background: var(--status-shield); box-shadow: 0 0 0 var(--space-4) color-mix(in oklab, var(--status-shield) 18%, transparent); }
    .ask { margin: var(--space-24) 0 0; font-family: var(--font-family-brand); font-size: var(--type-hero-size); line-height: var(--type-hero-line-height); letter-spacing: var(--type-hero-tracking); font-weight: var(--font-weight-display); font-variation-settings: "opsz" 96; }
    .ask label { display: block; cursor: text; }
    .ask input { position: absolute; opacity: 0; pointer-events: none; }
    .hints { margin-top: var(--space-24); display: flex; gap: var(--space-24); font-family: var(--font-family-mono); font-size: var(--type-caption-size); color: var(--text-tertiary); }
    kbd { font: inherit; color: var(--text-secondary); padding: 0 var(--space-6); border-radius: var(--radius-xs); box-shadow: inset 0 0 0 1px var(--border-hairline); }
    .recent { align-self: center; }
    .recent h2 { margin: 0 0 var(--space-12); font-family: var(--font-family-mono); font-size: var(--type-caption-size); font-weight: var(--font-weight-regular); color: var(--text-tertiary); }
    .recent ol { list-style: none; margin: 0; padding: 0; }
    .recent a { display: grid; grid-template-columns: var(--space-32) 1fr auto; align-items: center; gap: var(--space-8); height: var(--size-newtab-recent-row); border-top: 1px solid var(--border-hairline); color: var(--text-primary); text-decoration: none; font-size: var(--type-title-size); letter-spacing: var(--type-title-tracking); transition: transform var(--motion-duration-fast) var(--motion-ease-out); }
    .recent li:last-child a { border-bottom: 1px solid var(--border-hairline); }
    .recent a:hover { transform: translateX(calc(var(--space-4) * var(--motion-distance-scale))); }
    .recent time { font-family: var(--font-family-mono); font-size: var(--type-caption-size); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
    .recent .off { margin-top: var(--space-16); font-family: var(--font-family-mono); font-size: var(--type-caption-size); color: var(--text-tertiary); }
    .recent .off a { display: inline; border: 0; font: inherit; color: var(--accent-ink); }
    .fav { display: inline-grid; place-items: center; width: var(--space-24); height: var(--space-24); border-radius: var(--radius-xs); background: var(--fill, var(--accent-fill)); color: var(--accent-on-fill); font-size: var(--type-micro-size); font-weight: var(--font-weight-medium); }

    /* ---------- page stand-in (a website, deliberately neutral) ---------- */
    .page { position: absolute; inset: 0; background: var(--surface-raised); overflow: hidden; }
    .site { max-width: calc(var(--size-newtab-content-max) - var(--space-80)); margin: 0 auto; padding: var(--space-64) var(--space-40); display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-48); }
    .ph { background: var(--surface-sunken); border-radius: var(--radius-xs); height: var(--space-12); margin-bottom: var(--space-12); }
    .ph.h { height: var(--space-40); width: 75%; margin-bottom: var(--space-24); }
    .ph.img { height: calc(var(--space-80) * 3.6); border-radius: var(--radius-md); margin: var(--space-24) 0; }

    /* ---------- the island ---------- */
    .island {
      position: absolute; left: 50%; bottom: var(--size-island-inset-bottom); z-index: 20;
      width: var(--size-island-width); height: var(--size-island-height); transform: translateX(-50%);
      display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-8);
      border-radius: var(--radius-island); background: var(--island-bg); color: var(--island-text); box-shadow: var(--elev-island), inset 0 0 0 1px var(--island-border);
      transition: width var(--motion-spring-smooth-duration) var(--motion-spring-smooth);
    }
    .island.swell { width: var(--size-island-width-expanded); }
    .island :focus-visible { outline-color: var(--accent-island); }
    .ib { flex: none; width: var(--size-island-button); height: var(--size-island-button); display: grid; place-items: center; border: 0; border-radius: var(--radius-full); background: transparent; color: var(--island-text-secondary); transition: background-color var(--motion-duration-instant) var(--motion-ease-out), transform var(--motion-duration-instant) var(--motion-ease-out); }
    .ib:hover { background: var(--island-raised); color: var(--island-text); }
    .ib:active { transform: scale(var(--motion-press-scale)); }
    .ib .brand-mark { width: var(--space-24); height: var(--space-24); }
    .sep { flex: none; width: 1px; height: var(--space-24); background: var(--island-hairline); margin: 0 var(--space-4); }
    .addr { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-8); height: var(--size-island-button); padding: 0 var(--space-12); border-radius: var(--radius-full); font-size: var(--type-address-size); line-height: var(--type-address-line-height); letter-spacing: var(--type-address-tracking); white-space: nowrap; overflow: hidden; }
    .addr:hover { background: var(--island-raised); }
    .addr .path { font-family: var(--font-family-mono); font-size: var(--type-data-size); color: var(--island-text-secondary); overflow: hidden; mask-image: linear-gradient(90deg, black 70%, transparent); }
    .addr .ghost { color: var(--island-text-secondary); }
    .addr .lock { width: var(--space-16); height: var(--space-16); color: var(--island-text-secondary); }
    .addr.focus { background: var(--island-raised); box-shadow: inset 0 0 0 var(--size-focus-ring) var(--accent-island); }
    .addr .sel { background: var(--accent-island); color: var(--island-bg); border-radius: var(--space-2); }
    .pebble { flex: none; display: flex; align-items: center; gap: var(--space-8); height: calc(var(--size-island-button) - var(--space-4)); padding: 0 var(--space-12); border: 0; border-radius: var(--radius-full); background: var(--island-raised); color: var(--island-text); font-family: var(--font-family-mono); font-size: var(--type-data-size); font-variant-numeric: tabular-nums; }
    .pebble .lamp { background: var(--island-shield); box-shadow: 0 0 0 var(--space-4) color-mix(in oklab, var(--island-shield) 22%, transparent); }
    .pebble[aria-expanded="true"] { box-shadow: inset 0 0 0 var(--size-focus-ring) var(--accent-island); }
    .stack { flex: none; display: flex; align-items: center; padding: 0 var(--space-6); border: 0; background: transparent; color: var(--island-text-secondary); height: var(--size-island-button); border-radius: var(--radius-full); }
    .stack:hover { background: var(--island-raised); }
    .stack .fav { width: var(--size-island-tab-dot); height: var(--size-island-tab-dot); border-radius: var(--radius-full); margin-left: calc(var(--space-8) * -1); box-shadow: 0 0 0 var(--space-2) var(--island-bg), 0 0 0 calc(var(--space-2) + 1px) var(--island-bg); font-size: var(--type-caption-size); }
    .stack .fav:first-child { margin-left: 0; }
    .stack .fav.on { box-shadow: 0 0 0 var(--space-2) var(--island-bg), 0 0 0 var(--space-4) var(--accent-island); }
    .stack .more { margin-left: var(--space-8); font-family: var(--font-family-mono); font-size: var(--type-caption-size); }

    /* ---------- panels grow upward out of the island (Swell / Bloom) ---------- */
    @keyframes swell-up { from { opacity: 0; transform: translate(-50%, calc(var(--space-12) * var(--motion-distance-scale))) scale(var(--motion-bloom-scale)); } to { opacity: 1; transform: translate(-50%, 0); } }
    .panel { position: absolute; left: 50%; bottom: calc(var(--size-island-inset-bottom) + var(--size-island-height) + var(--space-12)); z-index: 19; transform: translateX(-50%); transform-origin: bottom center; background: var(--surface-raised); color: var(--text-primary); border-radius: var(--radius-lg); box-shadow: var(--elev-2), var(--elev-island); animation: swell-up var(--motion-duration-fast) var(--motion-ease-out) both; }
    [data-motion="reduced"] .panel { animation-name: fade; }

    .suggest { width: var(--size-island-width-expanded); padding: var(--space-8); }
    .row { display: grid; grid-template-columns: var(--space-32) 1fr auto; align-items: center; gap: var(--space-8); height: var(--space-48); padding: 0 var(--space-12); border-radius: var(--radius-md); font-size: var(--type-body-lg-size); }
    .row .icon { width: var(--space-16); height: var(--space-16); color: var(--text-tertiary); }
    .row .host { color: var(--accent-ink); font-family: var(--font-family-mono); font-size: var(--type-data-size); }
    .row .meta { font-family: var(--font-family-mono); font-size: var(--type-caption-size); color: var(--text-tertiary); }
    .row[aria-selected="true"] { background: var(--surface-sunken); }
    .row .fav { width: var(--space-20); height: var(--space-20); }

    .shelf { width: min(calc(100% - var(--space-80)), calc(var(--size-island-width-expanded) * 1.5)); padding: var(--space-16); }
    .shelf header { display: flex; justify-content: space-between; margin: 0 var(--space-4) var(--space-12); font-family: var(--font-family-mono); font-size: var(--type-caption-size); color: var(--text-tertiary); }
    .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-12); list-style: none; margin: 0; padding: 0; }
    .card { position: relative; border-radius: var(--radius-md); background: var(--surface-sunken); overflow: hidden; animation: rise var(--motion-duration-base) var(--motion-ease-out) both; animation-delay: calc(var(--i) * var(--motion-stagger-min)); }
    .card.on { box-shadow: 0 0 0 var(--size-focus-ring) var(--accent-ring); }
    .card .snap { aspect-ratio: 3 / 2; margin: var(--space-6); border-radius: var(--radius-sm); background: var(--surface-raised); padding: var(--space-8); }
    .card .snap i { display: block; height: var(--space-6); border-radius: var(--space-2); background: var(--surface-sunken); margin-bottom: var(--space-6); }
    .card .snap i.img { height: 40%; }
    .card .t { display: flex; align-items: center; gap: var(--space-8); padding: 0 var(--space-12) var(--space-8); font-size: var(--type-label-size); white-space: nowrap; overflow: hidden; mask-image: linear-gradient(90deg, black 80%, transparent); }
    .card .t .fav { flex: none; width: var(--space-16); height: var(--space-16); }
    .card .k { position: absolute; top: var(--space-12); right: var(--space-12); font-family: var(--font-family-mono); font-size: var(--type-micro-size); color: var(--text-tertiary); background: var(--surface-raised); padding: 0 var(--space-4); border-radius: var(--radius-xs); }
    .card.sleep .snap { opacity: var(--motion-sleep-opacity); }
    .card.add { display: grid; place-items: center; background: transparent; box-shadow: inset 0 0 0 1px var(--border-hairline); color: var(--text-secondary); min-height: calc(var(--space-80) * 1.6); }

    .shieldp { width: var(--size-popover-shield); left: calc(50% + var(--space-80) * 1.3); padding: var(--space-20); display: grid; gap: var(--space-16); }
    .shieldp header { display: flex; align-items: center; gap: var(--space-12); }
    .shieldp h2 { flex: 1; margin: 0; font-size: var(--type-title-size); line-height: var(--type-title-line-height); letter-spacing: var(--type-title-tracking); font-weight: var(--font-weight-medium); }
    .shieldp h2 small { display: block; font-family: var(--font-family-mono); font-size: var(--type-caption-size); line-height: var(--type-caption-line-height); letter-spacing: 0; color: var(--status-shield); font-weight: var(--font-weight-regular); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border-hairline); border-bottom: 1px solid var(--border-hairline); }
    .stat { padding: var(--space-12) 0; }
    .stat + .stat { padding-left: var(--space-16); border-left: 1px solid var(--border-hairline); }
    .stat b { display: block; font-size: var(--type-headline-size); line-height: var(--type-headline-line-height); letter-spacing: var(--type-headline-tracking); font-weight: var(--font-weight-medium); font-variant-numeric: tabular-nums; }
    .stat span { display: block; min-height: calc(var(--type-caption-line-height) * 2); font-family: var(--font-family-mono); font-size: var(--type-caption-size); line-height: var(--type-caption-line-height); color: var(--text-secondary); }
    .field { display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); font-size: var(--type-body-size); }
    .seg { display: inline-grid; grid-auto-flow: column; padding: var(--space-2); border-radius: var(--radius-full); background: var(--surface-sunken); }
    .seg button { height: var(--space-24); padding: 0 var(--space-12); border: 0; border-radius: var(--radius-full); background: transparent; color: var(--text-secondary); font-size: var(--type-caption-size); }
    .seg button[aria-pressed="true"] { background: var(--surface-raised); color: var(--text-primary); box-shadow: var(--elev-1); }
    .toggle { position: relative; flex: none; width: var(--size-toggle-width); height: var(--size-toggle-height); border: 0; border-radius: var(--radius-full); background: var(--border-strong); padding: 0; }
    .toggle::after { content: ""; position: absolute; top: calc((var(--size-toggle-height) - var(--size-toggle-knob)) / 2); left: calc((var(--size-toggle-height) - var(--size-toggle-knob)) / 2); width: var(--size-toggle-knob); height: var(--size-toggle-knob); border-radius: var(--radius-full); background: var(--surface-raised); box-shadow: var(--elev-1); transition: transform var(--motion-spring-snappy-duration) var(--motion-spring-snappy); }
    .toggle[aria-checked="true"] { background: var(--status-shield); }
    .toggle[aria-checked="true"]::after { transform: translateX(calc(var(--size-toggle-width) - var(--size-toggle-height))); }
    .link { display: inline-flex; align-items: center; gap: var(--space-4); color: var(--accent-ink); text-decoration: none; font-size: var(--type-body-size); }
    .link .icon { width: var(--space-16); height: var(--space-16); }
  </style>
</head>
<body>
  <div class="win" id="win"></div>
  <script>
    const S = new URLSearchParams(location.search).get('state') || 'newtab';
    const fills = ['sky', 'periwinkle', 'lavender', 'mint', 'ember'];
    const fav = (m, c, cls = '') => `<span class="fav ${cls}" style="--fill:var(--aura-${fills[c]}-fill)" aria-hidden="true">${m}</span>`;
    const tabs = [['Index.hr – Najnovije vijesti', 'I', 0], ['GitHub – scyde-browser/scyde', 'G', 3], ['YouTube', 'Y', 1, 'sleep'], ['Jutarnji list', 'J', 4], ['Recept: domaći kruh od kiselog tijesta', 'K', 2], ['hr.wikipedia.org', 'W', 0], ['Gmail', 'M', 2]];

    function island(addr, opts = {}) {
      return `<nav class="island${opts.swell ? ' swell' : ''}" aria-label="${t('island.label')}">
        <button class="ib" type="button" aria-label="${t('island.menu')}"><span class="brand-mark"></span></button>
        <button class="ib" type="button" aria-label="${t('nav.back')}"><span class="icon" data-icon="back"></span></button>
        <span class="sep"></span>
        <div class="addr${opts.focus ? ' focus' : ''}" role="${opts.focus ? 'combobox' : 'button'}" tabindex="0">${addr}</div>
        <button class="pebble" type="button" aria-expanded="${!!opts.shield}" aria-label="${t('island.shield', { n: 23 })}"><span class="lamp"></span>23</button>
        <span class="sep"></span>
        <button class="stack" type="button" role="tab" aria-expanded="${!!opts.tabs}" aria-label="${t('tabs.shelf')}">${fav('I', 0, opts.newtab ? '' : 'on')}${fav('G', 3)}${fav('Y', 1)}<span class="more">${t('island.more_tabs', { n: 4 })}</span></button>
      </nav>`;
    }
    const page = `<div class="page" aria-hidden="true"><div class="site"><div><div class="ph h"></div><div class="ph"></div><div class="ph" style="width:92%"></div><div class="ph" style="width:80%"></div><div class="ph img"></div><div class="ph"></div><div class="ph" style="width:70%"></div></div><div><div class="ph" style="width:60%"></div><div class="ph img" style="height:calc(var(--space-80) * 2)"></div><div class="ph"></div><div class="ph img" style="height:calc(var(--space-80) * 2)"></div></div></div></div>`;
    const caps = `<div class="caps"><button type="button" aria-label="Minimize"><span class="icon" data-icon="min"></span></button><button type="button" aria-label="Maximize"><span class="icon" data-icon="max"></span></button><button type="button" class="x" aria-label="Close"><span class="icon" data-icon="x"></span></button></div>`;
    const domain = `<span class="icon lock" data-icon="lock"></span><span>index.hr</span><span class="path">/vijesti/clanak/hrvatska-dobila-novi-most/2581044.aspx</span>`;

    let html = '';
    if (S === 'newtab') {
      const recent = [['index.hr', 'I', 0, t('time.min', { n: 2 })], ['github.com/scyde-browser', 'G', 3, t('time.min', { n: 18 })], ['youtube.com', 'Y', 1, t('time.h', { n: 1 })], ['hr.wikipedia.org', 'W', 0, t('time.h', { n: 3 })], ['jutarnji.hr', 'J', 4, t('time.yesterday')], ['mail.google.com', 'M', 2, t('time.yesterday')], ['reddit.com/r/croatia', 'R', 3, t('time.mon')]];
      html = `<main class="nt">
        <section class="nt-main">
          <p class="shield-line rise" style="--i:0;margin:0"><span class="lamp"></span><span>${t('newtab.shield_today')}</span><span><b>${fmtNum(1284)}</b> ${t('newtab.shield.blocked')}</span><span><b>42 MB</b> ${t('newtab.shield.saved')}</span><span><b>≈ 3 min</b> ${t('newtab.shield.time')}</span></p>
          <h1 class="ask rise" style="--i:1"><label for="q">${t('newtab.ask.1')}<br>${t('newtab.ask.2')}<span class="caret"></span></label><input id="q" type="search" autocomplete="off" aria-label="${t('newtab.search.placeholder')}" autofocus></h1>
          <div class="hints rise" style="--i:2"><span><kbd>Enter</kbd> ${t('newtab.hint.enter')}</span><span><kbd>Ctrl K</kbd> ${t('newtab.hint.commands')}</span><span><kbd>Tab</kbd> ${t('newtab.hint.recent')}</span></div>
        </section>
        <aside class="recent"><h2>${t('newtab.recent')}</h2><ol>${recent.map(([h, m, c, tm], i) => `<li class="rise" style="--i:${i + 3}"><a href="#">${fav(m, c)}<span>${h}</span><time>${tm}</time></a></li>`).join('')}</ol>
          <p class="off">${t('newtab.stories.off_short')} · <a href="#">${t('newtab.stories.turn_on')}</a></p></aside>
      </main>` + caps + island(`<span class="ghost">${t('island.new_tab')}</span>`, { newtab: true });
    } else if (S === 'omnibox') {
      html = page + caps + `<div class="panel suggest" role="listbox">
          <div class="row" role="option" aria-selected="true">${fav('J', 4)}<span>Jutarnji list – Najnovije vijesti <span class="host">jutarnji.hr</span></span><kbd>Enter</kbd></div>
          <div class="row" role="option"><span class="icon" data-icon="search"></span><span>${t('omnibox.suggest.search', { q: 'jutarnji list' })}</span><span class="meta">DuckDuckGo</span></div>
          <div class="row" role="option"><span class="icon" data-icon="clock"></span><span>Vijesti – Jutarnji.hr <span class="host">jutarnji.hr/vijesti</span></span><span class="meta">${t('omnibox.suggest.history')}</span></div>
          <div class="row" role="option"><span class="icon" data-icon="star"></span><span>Sport <span class="host">sportske.jutarnji.hr</span></span><span class="meta">${t('omnibox.suggest.bookmark')}</span></div>
        </div>` + island(`<span class="icon lock" data-icon="search"></span><span>jutarnji<span class="sel">.hr</span></span>`, { swell: true, focus: true });
    } else if (S === 'tabs') {
      html = page + caps + `<section class="panel shelf" aria-label="${t('tabs.shelf')}"><header><span>${t('mobile.tabs.count', { n: 7 })}</span><span>${t('tabs.keys')}</span></header>
        <ul class="cards">${tabs.map(([tt, m, c, cls], i) => `<li class="card ${i === 0 ? 'on' : ''} ${cls || ''}" style="--i:${i}"><span class="k">${i + 1}</span><div class="snap"><i style="width:70%"></i><i></i><i class="img"></i><i style="width:60%"></i></div><div class="t">${fav(m, c)}${tt}</div></li>`).join('')}
        <li class="card add" style="--i:7"><span class="icon" data-icon="plus"></span></li></ul></section>` + island(domain, { swell: true, tabs: true });
    } else {
      html = page + caps + (S === 'shield' ? `<section class="panel shieldp" role="dialog" aria-label="${t('shield.panel.title', { site: 'index.hr' })}">
          <header><h2>${t('shield.panel.title', { site: 'index.hr' })}<small>${t('shield.on_for_site')}</small></h2><button class="toggle" role="switch" aria-checked="true" aria-label="${t('shield.on_for_site')}"></button></header>
          <div class="stats"><div class="stat"><b>23</b><span>${t('shield.panel.blocked')}</span></div><div class="stat"><b>1,8 MB</b><span>${t('shield.panel.saved')}</span></div></div>
          <div class="field"><span>${t('shield.panel.level')}</span><div class="seg"><button aria-pressed="true">${t('shield.panel.level.standard')}</button><button aria-pressed="false">${t('shield.panel.level.aggressive')}</button></div></div>
          <div class="field"><span>${t('shield.panel.zen')}</span><button class="toggle" role="switch" aria-checked="false" aria-label="${t('shield.panel.zen')}"></button></div>
          <a class="link" href="#">${t('shield.panel.details')}<span class="icon" data-icon="chevron"></span></a></section>` : '') + island(domain, { shield: S === 'shield' });
    }
    document.getElementById('win').innerHTML = html;
    document.querySelectorAll('[role=switch]').forEach((b) => b.addEventListener('click', () => b.setAttribute('aria-checked', b.getAttribute('aria-checked') !== 'true')));
  </script>
</body>
</html>
