<!doctype html>
<html lang="hr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCYDE · smjer B "Kralježnica"</title>
<link rel="stylesheet" href="../../_shared/fonts/fonts.css">
<style>
/* Exploration tokens for direction B (editorial). If chosen, they move into design/tokens. */
:root {
  --paper: #F2EEE6; --paper-2: #E8E2D6; --ink: #191714; --ink-2: #5E584F; --ink-3: #8F887C; --rule: rgba(25,23,20,.16);
  --ember: #C93A33; --shield: #2F7D4F;
  --serif: "Fraunces", Georgia, serif; --mono: "Geist Mono", ui-monospace, monospace; --sans: "Geist", system-ui, sans-serif;
}
[data-theme="dark"] {
  --paper: #141311; --paper-2: #1C1A17; --ink: #EDE7DB; --ink-2: #ADA595; --ink-3: #7C7569; --rule: rgba(237,231,219,.14);
  --ember: #F06A4F; --shield: #7BD8A0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
.win { display: grid; grid-template-columns: 64px 1fr; height: 100dvh; }

/* ---------- the spine: tabs as vertical titles ---------- */
.spine { background: var(--paper-2); border-right: 1px solid var(--rule); display: flex; flex-direction: column; align-items: center; padding: 18px 0 16px; gap: 6px; }
.mark { width: 18px; height: 28px; background: var(--ember); -webkit-mask: var(--s) center/contain no-repeat; mask: var(--s) center/contain no-repeat; margin-bottom: 18px; }
.vtab { writing-mode: vertical-rl; transform: rotate(180deg); display: flex; align-items: center; gap: 10px; padding: 12px 0; max-height: 132px; overflow: hidden; color: var(--ink-3); font: 13px var(--sans); white-space: nowrap; position: relative; }
.vtab i { font-style: normal; font: 11px var(--mono); color: var(--ink-3); }
.vtab.on { color: var(--ink); }
.vtab.on::after { content: ""; position: absolute; right: -16px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--ember); }
.vtab.sleep { opacity: .55; }
.plus { margin-top: 8px; width: 36px; height: 36px; border-radius: 50%; border: 1px dashed var(--rule); display: grid; place-items: center; color: var(--ink-3); font: 18px var(--sans); }
.grow { flex: 1; }
.snum { font: 500 22px/1 var(--serif); color: var(--shield); font-variant-numeric: tabular-nums; }
.slab { font: 10px var(--mono); color: var(--ink-3); margin-top: 4px; }

/* ---------- top line inside the page area ---------- */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; }
.topline { height: 44px; display: flex; align-items: center; gap: 18px; padding: 0 20px 0 28px; border-bottom: 1px solid var(--rule); font: 13px var(--mono); color: var(--ink-3); }
.crumb { flex: 1; display: flex; gap: 10px; white-space: nowrap; overflow: hidden; }
.crumb b { color: var(--ink); font-weight: 500; }
.topline .sh { color: var(--shield); }
.caps { display: flex; gap: 14px; color: var(--ink-3); }

/* ---------- New Tab: a front page ---------- */
.front { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.35fr 1fr; grid-template-rows: 1fr auto; column-gap: 72px; padding: 48px 72px 36px; }
.dateline { font: 13px var(--mono); color: var(--ink-3); display: flex; justify-content: space-between; border-bottom: 1px solid var(--ink); padding-bottom: 10px; margin-bottom: 36px; }
.q { font: 300 96px/0.95 var(--serif); letter-spacing: -.035em; font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 1; margin: 0; }
.q em { font-style: italic; font-weight: 400; color: var(--ember); }
.field { margin-top: 40px; display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; font: 300 30px var(--serif); color: var(--ink-3); }
.field .go { margin-left: auto; font: 13px var(--mono); color: var(--paper); background: var(--ember); padding: 8px 14px; border-radius: 3px; }
.index h3 { font: 13px var(--mono); color: var(--ink-3); font-weight: 400; margin: 6px 0 14px; display: flex; justify-content: space-between; }
.index ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.index li { display: grid; grid-template-columns: 44px 1fr auto; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.index li span:first-child { font: 12px var(--mono); color: var(--ink-3); }
.index li a { font: 400 26px/1.15 var(--serif); letter-spacing: -.01em; color: var(--ink); text-decoration: none; font-variation-settings: "opsz" 48; }
.index li small { font: 12px var(--mono); color: var(--ink-3); }
.ledger { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr) 1.2fr; border-top: 1px solid var(--ink); margin-top: 36px; }
.ledger div { padding: 16px 20px 0 0; }
.ledger b { display: block; font: 300 52px/1 var(--serif); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ledger span { font: 12px var(--mono); color: var(--ink-3); }
.ledger p { margin: 0; font: italic 300 17px/1.45 var(--serif); color: var(--ink-2); }

/* ---------- Browse ---------- */
.page { flex: 1; background: #FFFFFF; overflow: hidden; }
[data-theme="dark"] .page { background: #1B1A18; }
.site { max-width: 1000px; margin: 0 auto; padding: 48px 40px; display: grid; grid-template-columns: 2fr 1fr; gap: 44px; }
.ph { background: color-mix(in oklab, var(--ink) 8%, transparent); border-radius: 4px; height: 12px; margin-bottom: 14px; }
.ph.h { height: 38px; width: 75%; margin-bottom: 26px; } .ph.img { height: 300px; margin: 26px 0; }

@media (max-width: 600px) {
  .win { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .spine { order: 2; flex-direction: row; height: 64px; padding: 0 14px max(env(safe-area-inset-bottom), 8px); border-right: 0; border-top: 1px solid var(--rule); overflow: hidden; gap: 14px; }
  .mark { margin: 0; }
  .vtab { writing-mode: horizontal-tb; transform: none; padding: 0; max-width: 90px; }
  .vtab.on::after { left: 0; right: 0; top: auto; bottom: -10px; height: 3px; width: auto; }
  .vtab:nth-of-type(n+4) { display: none; }
  .plus { margin: 0; }
  .slab { display: none; }
  .topline { padding: 0 16px; } .caps { display: none; }
  .front { grid-template-columns: 1fr; padding: 22px 18px 18px; overflow: hidden; }
  .q { font-size: 56px; }
  .field { margin-top: 22px; font-size: 20px; }
  .index { margin-top: 26px; }
  .index li a { font-size: 21px; }
  .index li:nth-child(n+5) { display: none; }
  .ledger { grid-template-columns: repeat(3, 1fr); margin-top: 18px; }
  .ledger b { font-size: 28px; } .ledger p { display: none; }
  .site { grid-template-columns: 1fr; padding: 24px 18px; }
}
</style>
</head>
<body>
<div class="win" id="win"></div>
<script>
const q = new URLSearchParams(location.search);
document.documentElement.dataset.theme = q.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const S = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='313 197 398 630'><g fill='none' stroke='black' stroke-width='118'><path d='M500 256A128 128 0 0 0 500 512'/><path d='M524 512A128 128 0 0 1 524 768'/></g><circle cx='500' cy='256' r='59'/><circle cx='524' cy='768' r='59'/></svg>";
document.documentElement.style.setProperty('--s', `url("data:image/svg+xml,${encodeURIComponent(S)}")`);
const state = q.get('state') || 'newtab';
const tabs = [['01', 'Index.hr – Najnovije vijesti', state === 'browse'], ['02', 'GitHub – scyde-browser'], ['03', 'YouTube', false, true], ['04', 'Recept: domaći kruh'], ['05', state === 'newtab' ? 'Nova stranica' : 'Wikipedia', state === 'newtab']];
const spine = `<aside class="spine"><span class="mark" aria-label="SCYDE"></span>
  ${tabs.map(([n, t, on, sl]) => `<div class="vtab${on ? ' on' : ''}${sl ? ' sleep' : ''}"><i>${n}</i>${t}</div>`).join('')}
  <span class="plus">+</span><span class="grow"></span><span class="snum">23</span><span class="slab">shield</span></aside>`;
const caps = `<span class="caps"><span>–</span><span>□</span><span>✕</span></span>`;
const win = document.getElementById('win');
if (state === 'newtab') {
  const sites = [['index.hr', 'svaki dan'], ['github.com/scyde-browser', '18 min'], ['youtube.com', '1 h'], ['hr.wikipedia.org', '3 h'], ['jutarnji.hr', 'jučer'], ['mail.google.com', 'jučer'], ['reddit.com/r/croatia', 'pon']];
  win.innerHTML = spine + `<div class="main">
    <div class="topline"><span class="crumb"><b>scyde</b><span>/</span><span>nova stranica</span></span><span class="sh">● shield aktivan</span>${caps}</div>
    <div class="front">
      <section>
        <div class="dateline"><span>utorak, 11. studenoga 2026.</span><span>Zagreb · 9 °C</span></div>
        <h1 class="q">Što danas<br><em>tražiš</em>?</h1>
        <div class="field">upiši adresu ili pitanje<span class="go">Enter ↵</span></div>
      </section>
      <section class="index"><h3><span>kazalo</span><span>Alt + broj</span></h3><ol>
        ${sites.map(([s, t], i) => `<li><span>0${i + 1}</span><a href="#">${s}</a><small>${t}</small></li>`).join('')}</ol></section>
      <footer class="ledger">
        <div><b>1.284</b><span>blokirano danas</span></div>
        <div><b>42 MB</b><span>podataka ušteđeno</span></div>
        <div><b>≈ 3 min</b><span>vremena vraćeno</span></div>
        <div><p>Najviše je zaustavljeno na jutarnji.hr: 44 zahtjeva po učitavanju. Ništa od toga nije napustilo uređaj.</p></div>
      </footer>
    </div></div>`;
} else {
  win.innerHTML = spine + `<div class="main"><div class="topline"><span class="crumb">🔒 <b>index.hr</b><span>/</span><span>vijesti</span><span>/</span><span>hrvatska-dobila-novi-most</span></span><span class="sh">23 blokirano</span>${caps}</div>
    <div class="page"><div class="site"><div><div class="ph h"></div><div class="ph"></div><div class="ph" style="width:90%"></div><div class="ph" style="width:80%"></div><div class="ph img"></div><div class="ph"></div></div><div><div class="ph" style="width:60%"></div><div class="ph img" style="height:160px"></div><div class="ph"></div></div></div></div></div>`;
}
</script>
</body>
</html>
