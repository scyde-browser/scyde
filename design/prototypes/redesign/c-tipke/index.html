<!doctype html>
<html lang="hr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCYDE · smjer C "Tipke"</title>
<link rel="stylesheet" href="../../_shared/fonts/fonts.css">
<style>
/* Exploration tokens for direction C (keyboard). If chosen, they move into design/tokens. */
:root {
  --bg: #E9EBEF; --cap: #FFFFFF; --cap-edge: #C9CDD6; --cap-press: #F4F5F7; --ink: #111216; --ink-2: #545866; --ink-3: #8A8F9C; --line: rgba(17,18,22,.10);
  --sel: #ABD5E9; --on-sel: #111216; --ember: #C93A33; --shield: #107640;
  --mono: "Geist Mono", ui-monospace, monospace; --sans: "Geist", system-ui, sans-serif;
  --key: 112px; --gap: 12px;
}
[data-theme="dark"] {
  --bg: #0F1115; --cap: #1B1E25; --cap-edge: #07080A; --cap-press: #23262E; --ink: #EEF0F4; --ink-2: #A3A7B3; --ink-3: #6C7180; --line: rgba(255,255,255,.08);
  --sel: #ABD5E9; --ember: #FF7A5C; --shield: #A6F1C9;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
.win { height: 100dvh; display: flex; flex-direction: column; }
.k { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 7px; background: var(--cap); box-shadow: 0 2px 0 var(--cap-edge), inset 0 0 0 1px var(--line); font: 500 12px var(--mono); color: var(--ink-2); }

/* ---------- top bar: tabs are numbered keys, address is a command line ---------- */
.bar { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; }
.mark { width: 14px; height: 22px; margin-right: 8px; background: var(--ember); -webkit-mask: var(--s) center/contain no-repeat; mask: var(--s) center/contain no-repeat; }
.tab { display: flex; align-items: center; gap: 8px; height: 34px; max-width: 190px; padding: 0 12px 0 6px; border-radius: 9px; background: var(--cap); box-shadow: 0 2px 0 var(--cap-edge), inset 0 0 0 1px var(--line); font: 13px var(--sans); color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.tab .n { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--bg); font: 500 11px var(--mono); color: var(--ink-3); }
.tab.on { background: var(--sel); color: var(--on-sel); box-shadow: 0 2px 0 color-mix(in oklab, var(--sel) 55%, #000), inset 0 0 0 1px var(--line); transform: translateY(1px); }
.tab.on .n { background: rgba(255,255,255,.55); color: var(--on-sel); }
.tab.zz { opacity: .5; }
.cmd { flex: 1; display: flex; align-items: center; gap: 10px; height: 34px; margin-left: 8px; padding: 0 14px; border-radius: 9px; background: color-mix(in oklab, var(--cap) 50%, var(--bg)); box-shadow: inset 0 0 0 1px var(--line); font: 13px var(--mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.cmd .p { color: var(--ember); }
.cmd b { color: var(--ink); font-weight: 500; }
.sk { display: flex; align-items: center; gap: 6px; font: 13px var(--mono); color: var(--shield); }
.caps { display: flex; gap: 14px; margin-left: 10px; font: 12px var(--mono); color: var(--ink-3); }

/* ---------- New Tab: a keyboard of places ---------- */
.nt { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; padding-bottom: 40px; }
.prompt { width: min(880px, 92vw); display: flex; align-items: center; gap: 14px; font: 400 40px var(--mono); letter-spacing: -.02em; }
.prompt .p { color: var(--ember); }
.prompt .ph { color: var(--ink-3); white-space: nowrap; }
.cur { width: 18px; height: 40px; background: var(--ink); animation: b 1.1s steps(1) infinite; }
@keyframes b { 50% { opacity: 0; } }
.kb { display: flex; flex-direction: column; gap: var(--gap); }
.row { display: flex; gap: var(--gap); }
.row:nth-child(2) { padding-left: calc(var(--key) * .28); }
.row:nth-child(3) { padding-left: calc(var(--key) * .62); }
.key { position: relative; width: var(--key); height: var(--key); border-radius: 18px; background: var(--cap); box-shadow: 0 4px 0 var(--cap-edge), inset 0 0 0 1px var(--line); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
.key .l { font: 500 15px var(--mono); color: var(--ink-3); }
.key .site { font: 500 13px/1.2 var(--sans); color: var(--ink); white-space: nowrap; overflow: hidden; mask-image: linear-gradient(90deg, #000 80%, transparent); }
.key .fav { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 600 12px var(--sans); color: #111216; }
.key.empty { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.key.empty .site { color: var(--ink-3); }
.key.hot { transform: translateY(3px); box-shadow: 0 1px 0 var(--cap-edge), inset 0 0 0 2px var(--ember); }
.legend { display: flex; gap: 26px; font: 13px var(--mono); color: var(--ink-3); }
.legend b { color: var(--ink); font-weight: 500; }

/* ---------- Browse ---------- */
.page { flex: 1; margin: 0 8px 8px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
[data-theme="dark"] .page { background: #16181D; }
.site2 { max-width: 1000px; margin: 0 auto; padding: 48px 40px; display: grid; grid-template-columns: 2fr 1fr; gap: 44px; }
.ph2 { background: color-mix(in oklab, var(--ink) 7%, transparent); border-radius: 6px; height: 12px; margin-bottom: 14px; }
.ph2.h { height: 36px; width: 70%; margin-bottom: 24px; } .ph2.img { height: 300px; border-radius: 12px; margin: 24px 0; }
.toast { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font: 13px var(--mono); }
.toast .k { background: color-mix(in oklab, var(--bg) 15%, var(--ink)); color: var(--bg); box-shadow: none; }

@media (max-width: 600px) {
  :root { --key: 76px; --gap: 9px; }
  .bar { height: 56px; }
  .tab:nth-of-type(n+3), .caps, .sk span:last-child { display: none; }
  .cmd { font-size: 12px; }
  .prompt { font-size: 26px; } .cur { height: 28px; width: 12px; }
  .row:nth-child(n) { padding-left: 0; }
  .row .key:nth-child(n+5) { display: none; }
  .key { border-radius: 14px; padding: 9px; } .key .fav { width: 22px; height: 22px; top: 9px; right: 9px; }
  .key .site { font-size: 11px; }
  .legend { flex-wrap: wrap; justify-content: center; gap: 8px 16px; font-size: 12px; padding: 0 16px; }
  .site2 { grid-template-columns: 1fr; padding: 24px 18px; }
}
</style>
</head>
<body>
<div class="win" id="win"></div>
<script>
const q = new URLSearchParams(location.search);
document.documentElement.dataset.theme = q.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const S = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='313 197 398 630'><g fill='none' stroke='black' stroke-width='118'><path d='M500 256A128 128 0 0 0 500 512'/><path d='M524 512A128 128 0 0 1 524 768'/></g><circle cx='500' cy='256' r='59'/><circle cx='524' cy='768' r='59'/></svg>";
document.documentElement.style.setProperty('--s', `url("data:image/svg+xml,${encodeURIComponent(S)}")`);
const fills = ['#ABD5E9', '#A6C0F1', '#C6A5F1', '#A6F1C9', '#FF9F7E'];
const state = q.get('state') || 'newtab';
const tabs = [['1', 'Index.hr – Najnovije vijesti', state === 'browse'], ['2', 'GitHub – scyde-browser'], ['3', 'YouTube', false, true], ['4', state === 'newtab' ? 'Nova kartica' : 'Wikipedia', state === 'newtab']];
const bar = (cmd) => `<header class="bar"><span class="mark" aria-label="SCYDE"></span>
  ${tabs.map(([n, t, on, zz]) => `<div class="tab${on ? ' on' : ''}${zz ? ' zz' : ''}"><span class="n">${n}</span>${t}</div>`).join('')}
  <span class="k">+</span>
  <div class="cmd">${cmd}</div>
  <span class="sk"><span class="k" style="color:var(--shield)">S</span><span>23</span></span>
  <span class="caps"><span>–</span><span>□</span><span>✕</span></span></header>`;
const keys = [
  [['Q', 'index.hr', 'I', 0], ['W', 'hr.wikipedia.org', 'W', 0], ['E', 'mail.google.com', 'M', 2], ['R', 'reddit.com', 'R', 3], ['T', 'twitch.tv', 'T', 2], ['Y', 'youtube.com', 'Y', 1]],
  [['A', 'github.com', 'G', 3], ['S', 'Shield', '', -1], ['D', 'drive.google.com', 'D', 1], ['F', 'forbes.com', 'F', 4], ['G', null], ['H', null]],
  [['Z', 'zagreb.hr', 'Z', 0], ['X', null], ['C', 'cnn.com', 'C', 4], ['V', null], ['B', null], ['N', 'net.hr', 'N', 1]],
];
const key = ([l, site, m, c]) => site === null
  ? `<div class="key empty"><span class="l">${l}</span><span class="site">+ dodaj</span></div>`
  : c === -1
  ? `<div class="key"><span class="l">${l}</span><span class="fav" style="background:var(--shield);color:var(--bg)">✓</span><span class="site">Shield<br><span style="color:var(--ink-3)">1.284 danas</span></span></div>`
  : `<div class="key${l === 'Q' ? ' hot' : ''}"><span class="l">${l}</span><span class="fav" style="background:${fills[c]}">${m}</span><span class="site">${site}</span></div>`;
const win = document.getElementById('win');
if (state === 'newtab') {
  win.innerHTML = bar('<span class="p">›</span><span>nova kartica</span>') + `
  <main class="nt">
    <div class="prompt"><span class="p">›</span><span class="ph">upiši ili pritisni slovo</span><span class="cur"></span></div>
    <div class="kb">${keys.map((r) => `<div class="row">${r.map(key).join('')}</div>`).join('')}</div>
    <div class="legend"><span><span class="k">Q</span>–<span class="k">N</span> otvori</span><span><span class="k">1</span>–<span class="k">9</span> kartice</span><span><span class="k">Ctrl</span> <span class="k">K</span> naredbe</span><span>Shield: <b>1.284</b> blokirano · <b>42 MB</b> ušteđeno</span></div>
  </main>`;
} else {
  win.innerHTML = bar('<span class="p">›</span><span>🔒 <b>index.hr</b>/vijesti/hrvatska-dobila-novi-most</span>') + `
  <div class="page"><div class="site2"><div><div class="ph2 h"></div><div class="ph2"></div><div class="ph2" style="width:90%"></div><div class="ph2 img"></div><div class="ph2"></div></div><div><div class="ph2" style="width:60%"></div><div class="ph2 img" style="height:160px"></div><div class="ph2"></div></div></div></div>
  <div class="toast"><span class="k">Esc</span> natrag na tipke <span class="k">1</span>–<span class="k">4</span> prebaci karticu</div>`;
}
</script>
</body>
</html>
