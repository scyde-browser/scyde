[package]
name = "scyde-shield-wasm-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "Spike S3: adblock-rust compiled to WASM for the GeckoView built-in extension (G3)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
