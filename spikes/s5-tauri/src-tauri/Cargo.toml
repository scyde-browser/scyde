[package]
name = "scyde-spike-s5"
version = "0.0.1"
edition = "2024"
publish = false
description = "Spikes S5 (Tauri multiwebview), S2 option B (WebResourceRequested) and S1 (Google sign-in) on WebView2"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com"] }
windows-core = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
